name: Bug report
description: Report an error or unexpected behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.
        Please fill all required fields so we can reproduce the issue quickly.

  - type: input
    id: summary
    attributes:
      label: Short summary
      description: One sentence about the problem
      placeholder: "Broadcast does not start after command"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide exact ordered steps
      placeholder: |
        1. Open bot ...
        2. Send command ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "Bot should ..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: "Bot actually ..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback / screenshots
      description: Paste relevant logs (without secrets)
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Commit SHA, branch, or release tag
      placeholder: "e.g. 2bafe07"
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local (python)
        - Docker
        - Other
    validations:
      required: true
